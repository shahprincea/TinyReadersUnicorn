<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TinyReaders - Magical Reading!</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fce4ec 0%, #e0f7fa 50%, #f3e5f5 100%);
            --primary: #ff80ab;    
            --secondary: #18ffff;  
            --accent: #b388ff;     
            --gold: #ffd740;       
            --text-main: #4a148c;  
            --inactive: #d1c4e9;   
            --bubble-bg: radial-gradient(circle at 30% 30%, #ffffff, #e0f2f1);
            --icy-bg: linear-gradient(180deg, #e0f7fa 0%, #80deea 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Nunito', 'Comic Sans MS', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            touch-action: none; /* Prevents pull-to-refresh and zooming */
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            text-align: center;
            position: relative;
        }
        .screen.active {
            display: flex;
        }

        h1 {
            font-size: clamp(2rem, 7vw, 4.5rem);
            color: var(--primary);
            text-shadow: 3px 3px 0px #fff, 5px 5px 0px var(--accent);
            margin-bottom: 10px;
            font-weight: 900;
        }
        
        p.subtitle {
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            color: #6a1b9a;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .instruction-text {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            color: #6a1b9a;
            margin-bottom: 20px;
            min-height: 50px;
            font-weight: 800;
            text-shadow: 2px 2px 0px #fff;
        }

        .btn-massive {
            background-color: var(--primary);
            color: white;
            border: 4px solid #fff;
            border-radius: 50px;
            padding: 20px 40px;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 8px 0px #c51162;
            transition: transform 0.1s, box-shadow 0.1s;
            font-family: inherit;
            margin: 10px;
            min-width: 250px;
            min-height: 80px;
        }
        .btn-massive:active {
            transform: translateY(8px);
            box-shadow: 0 0px 0px #c51162;
        }
        
        .btn-menu-item {
            width: 90%;
            max-width: 450px;
            background-color: rgba(255, 255, 255, 0.9);
            color: var(--text-main);
            border: 4px solid var(--accent);
            box-shadow: 0 6px 0px var(--accent);
            margin-bottom: 12px;
            padding: 12px 25px;
            font-size: clamp(1.1rem, 3.5vw, 1.5rem);
            font-weight: 800;
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 60px;
        }
        .btn-menu-item:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px var(--accent);
        }

        .top-nav {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
        }
        
        .btn-back {
            background-color: white;
            color: var(--text-main);
            border: 3px solid var(--accent);
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 1.2rem;
            font-weight: 800;
            box-shadow: 0 4px 0px var(--accent);
            cursor: pointer;
            min-width: 80px;
        }
        .btn-back:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0px var(--accent);
        }

        .game-board {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 900px;
            flex: 1;
            align-content: center;
            padding-bottom: 20px;
            position: relative;
        }
        
        .letter-block {
            width: clamp(80px, 20vw, 140px);
            height: clamp(80px, 20vw, 140px);
            background-color: white;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(3rem, 7vw, 5rem);
            font-weight: 900;
            color: var(--text-main);
            cursor: pointer;
            box-shadow: 0 10px 0px rgba(0,0,0,0.1);
            border: 6px solid var(--primary);
            text-transform: lowercase;
            transition: transform 0.2s;
        }
        
        .bubble-block {
            border-radius: 50%;
            border: 6px solid var(--secondary);
            background: var(--bubble-bg);
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.1), 0 10px 0px #00b8d4;
            color: #00838f;
        }
        
        .cloud-block {
            width: auto;
            padding: 15px 30px;
            height: clamp(60px, 12vw, 90px);
            border-radius: 50px;
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            background: white;
            border: 4px solid #fff;
            box-shadow: 0 8px 0px rgba(0,0,0,0.1);
            text-transform: none; 
            margin: 10px;
        }

        .slider-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px;
        }
        .slider-letters {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 0 15%;
            font-size: clamp(4rem, 12vw, 6rem);
            font-weight: 900;
            color: var(--text-main);
            margin-bottom: 20px;
        }
        .slider-track {
            width: 100%;
            height: 50px;
            background: rgba(255,255,255,0.6);
            border-radius: 25px;
            border: 4px solid var(--accent);
            position: relative;
        }
        .slider-thumb {
            width: 80px;
            height: 80px;
            background: white;
            border: 5px solid var(--gold);
            border-radius: 50%;
            position: absolute;
            top: -19px;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            box-shadow: 0 8px 0px #f57f17;
            cursor: grab;
            z-index: 5;
        }
        .slider-progress {
            height: 100%;
            background: var(--gold);
            border-radius: 20px;
            width: 0%;
        }

        .frozen-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
        }
        .frozen-emoji-pop {
            position: absolute;
            top: -60px;
            font-size: clamp(5rem, 15vw, 8rem);
            opacity: 0;
            filter: drop-shadow(0 10px 5px rgba(0,0,0,0.2));
            z-index: 10;
        }
        .frozen-row {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            position: relative;
            margin-top: 40px;
        }
        
        .frozen-slot {
            width: clamp(70px, 18vw, 120px);
            height: clamp(80px, 20vw, 130px);
            border: 4px dashed #90caf9;
            background: rgba(255,255,255,0.5);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(3.5rem, 8vw, 5rem);
            font-weight: 900;
            color: var(--primary);
            transform-style: preserve-3d;
        }
        .frozen-block {
            width: clamp(70px, 18vw, 120px);
            height: clamp(80px, 20vw, 130px);
            background: var(--icy-bg);
            border: 4px solid #00bcd4;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(3.5rem, 8vw, 5rem);
            font-weight: 900;
            color: #006064;
            box-shadow: inset 0 5px 10px rgba(255,255,255,0.8), 0 6px 0px #0097a7;
            text-shadow: 1px 1px 0px #fff;
        }
        .frozen-opts {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }

        .story-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 700px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 30px;
            padding: 20px;
            border: 4px solid white;
        }
        .story-picture {
            font-size: clamp(4rem, 12vw, 6rem);
            margin-bottom: 20px;
            filter: drop-shadow(0 10px 5px rgba(0,0,0,0.1));
        }
        .story-text {
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            line-height: 1.8;
            font-weight: 800;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }
        .story-word {
            display: inline-block;
            background: var(--inactive);
            color: #7e57c2;
            padding: 5px 15px;
            border-radius: 15px;
            cursor: pointer;
            border: 3px solid transparent;
            box-shadow: 0 4px 0px rgba(0,0,0,0.1);
        }
        .story-word.active-word {
            background: white;
            color: var(--text-main);
            border-color: var(--primary);
            transform: scale(1.1);
            box-shadow: 0 6px 0px var(--primary);
        }
        .story-word.completed-word {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 0px #c51162;
        }

        .drag-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            justify-content: space-between;
        }
        .drop-zones {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        .drop-zone {
            width: clamp(70px, 18vw, 110px);
            height: clamp(80px, 20vw, 120px);
            border: 4px dashed var(--accent);
            background: rgba(255,255,255,0.4);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(3rem, 7vw, 4.5rem);
            font-weight: 900;
            color: var(--text-main);
            transition: background 0.3s;
        }
        .drop-zone.filled {
            border-style: solid;
            background: white;
            box-shadow: 0 8px 0px var(--accent);
            color: var(--primary);
        }
        .drag-items-area {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            min-height: 130px;
            align-items: flex-end;
            position: relative;
        }
        .draggable-tile {
            width: clamp(70px, 18vw, 110px);
            height: clamp(80px, 20vw, 120px);
            background: white;
            border: 4px solid var(--gold);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(3rem, 7vw, 4.5rem);
            font-weight: 900;
            color: #e65100;
            box-shadow: 0 8px 0px #ffb300;
            cursor: grab;
            position: absolute;
            touch-action: none; 
            z-index: 20;
        }
        .draggable-tile.dragging {
            z-index: 100;
            opacity: 0.9;
            transform: scale(1.1);
            box-shadow: 0 15px 15px rgba(0,0,0,0.2);
        }
        .drag-emoji-pop {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: clamp(6rem, 20vw, 10rem);
            z-index: 5;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .drag-emoji-pop.show {
            transform: translate(-50%, -50%) scale(1);
        }

        @keyframes flipCardDown {
            0% { transform: rotateX(-90deg); opacity: 0; }
            100% { transform: rotateX(0deg); opacity: 1; }
        }
        .animate-flip {
            transform-origin: top;
            animation: flipCardDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            background: white !important;
            border-style: solid !important;
            border-color: var(--primary) !important;
        }

        @keyframes popEmojiUp {
            0% { transform: translateY(20px) scale(0.5); opacity: 0; }
            60% { transform: translateY(-15px) scale(1.2); opacity: 1; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        .animate-emoji-pop {
            animation: popEmojiUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0) scale(1); }
            40% { transform: translateY(-30px) scale(1.1); }
            60% { transform: translateY(-15px) scale(1.05); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        @keyframes dance {
            0% { transform: translateY(0) rotate(0deg) scale(1); }
            25% { transform: translateY(-30px) rotate(-15deg) scale(1.1); }
            50% { transform: translateY(0) rotate(0deg) scale(1.2); }
            75% { transform: translateY(-30px) rotate(15deg) scale(1.1); }
            100% { transform: translateY(0) rotate(0deg) scale(1); }
        }

        .correct {
            background-color: var(--gold);
            border-color: #ffc107;
            color: #bf360c;
            animation: bounce 1s ease;
            pointer-events: none;
            box-shadow: 0 10px 0px #ffc107;
        }
        .incorrect {
            animation: shake 0.5s ease;
        }
        .hint-shake {
            animation: shake 0.5s ease;
            border-color: var(--primary);
        }
        .completed-blend {
            background-color: var(--primary);
            border-color: #f50057;
            box-shadow: 0 10px 0px #f50057;
            color: white;
            animation: bounce 1s ease;
            pointer-events: none;
        }

        #praise-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #praise-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .unicorn-dancer {
            font-size: clamp(100px, 25vw, 180px);
            filter: drop-shadow(0 15px 10px rgba(0,0,0,0.2));
        }
        #praise-overlay.show .unicorn-dancer {
            animation: dance 1s infinite alternate;
        }
        .praise-text {
            margin-top: 30px;
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 900;
            color: var(--primary);
            text-shadow: 2px 2px 0px #fff, 4px 4px 0px var(--gold);
            text-align: center;
            padding: 0 20px;
        }
        
        .giant-emoji {
            font-size: clamp(8rem, 25vw, 12rem);
            animation: bounce 1.5s ease infinite;
            filter: drop-shadow(0 15px 15px rgba(0,0,0,0.2));
        }
        
        .menu-container {
            flex: 1;
            overflow-y: auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 20px;
        }
    </style>
</head>
<body>

    <div id="screen-splash" class="screen active">
        <h1>🦄 TinyReaders 👑</h1>
        <p class="subtitle">A Magical Reading Adventure!</p>
        <button class="btn-massive" onclick="initApp()">Start Playing 🔊</button>
    </div>

    <div id="screen-menu" class="screen" style="padding-top: 40px;">
        <h1 style="font-size: clamp(1.8rem, 5vw, 3rem);">Rainbow Castle Map</h1>
        <p class="subtitle">Choose your adventure!</p>
        
        <div class="menu-container">
            <button class="btn-menu-item" id="btn-stage-1" onclick="loadStage(1)">
                <span>1. Magic Sounds</span> <span class="icon">✨</span>
            </button>
            <button class="btn-menu-item" id="btn-stage-2" onclick="loadStage(2)">
                <span>2. Stretchy Snake</span> <span class="icon">🐍</span>
            </button>
            <button class="btn-menu-item" id="btn-stage-3" onclick="loadStage(3)">
                <span>3. Pop Bubbles</span> <span class="icon">🫧</span>
            </button>
            <button class="btn-menu-item" id="btn-stage-4" onclick="loadStage(4)">
                <span>4. Frozen Words</span> <span class="icon">🧊</span>
            </button>
            <button class="btn-menu-item" id="btn-stage-5" onclick="loadStage(5)">
                <span>5. Story Steps</span> <span class="icon">🐾</span>
            </button>
            <button class="btn-menu-item" id="btn-stage-6" onclick="loadStage(6)">
                <span>6. Picture Stories</span> <span class="icon">📖</span>
            </button>
            <button class="btn-menu-item" id="btn-stage-7" onclick="loadStage(7)">
                <span>7. Word Maker</span> <span class="icon">🧩</span>
            </button>
        </div>
    </div>

    <div id="screen-game" class="screen" style="justify-content: flex-start; padding-top: 70px;">
        <div class="top-nav">
            <button class="btn-back" onclick="showScreen('screen-menu')">⬅ Map</button>
        </div>
        
        <div class="instruction-text" id="game-instruction">Listen...</div>
        
        <div class="game-board" id="game-board"></div>
    </div>

    <div id="praise-overlay">
        <div class="unicorn-dancer">🦄</div>
        <div class="praise-text" id="praise-text">Magical!</div>
    </div>

    <script>
        const synth = window.speechSynthesis;
        let isAudioUnlocked = false;
        
        let globalTasksCompleted = 0;
        const TOTAL_STAGES = 7;

        // Phonetic Dictionary ensures correct sounding of letters
        const phoneticDict = {
            'a': 'ah', 'b': 'buh', 'c': 'kuh', 'd': 'duh', 'e': 'eh', 'f': 'fff',
            'g': 'guh', 'h': 'huh', 'i': 'ih', 'j': 'juh', 'k': 'kuh', 'l': 'lll', 
            'm': 'mmm', 'n': 'nnn', 'o': 'aw', 'p': 'puh', 'r': 'rrr', 's': 'sss',
            't': 'tuh', 'u': 'uh', 'v': 'vvv', 'w': 'wuh', 'y': 'yuh', 'z': 'zzz'
        };

        const praisePhrases = [
            "Magical!", 
            "You are a reading princess!", 
            "Wow, great job!", 
            "Sparkling work!",
            "Superstar reader!"
        ];

        // Strict Requirement: ONLY SAFE WORDS
        const curriculum = {
            1: ['s', 'a', 't', 'm', 'p', 'd', 'r', 'f', 'g', 'c', 'n', 'h', 'i', 'o', 'u'], 
            2: ['in', 'on', 'at', 'up', 'to', 'do', 'go', 'so', 'no', 'me', 'we', 'be', 'he'], 
            3: [ 
                { word: 'cat', emoji: '🐱' }, { word: 'bat', emoji: '🦇' }, { word: 'mat', emoji: '🟪' },
                { word: 'sun', emoji: '☀️' }, { word: 'cup', emoji: '☕' }, { word: 'pig', emoji: '🐷' },
                { word: 'dog', emoji: '🐶' }, { word: 'box', emoji: '📦' }, { word: 'fox', emoji: '🦊' },
                { word: 'bug', emoji: '🐛' }, { word: 'hug', emoji: '🤗' }, { word: 'map', emoji: '🗺️' }
            ],
            4: [ 
                // Frozen word families: 1st letter dynamic, 2nd and 3rd frozen separated
                { 
                    frozen1: 'a', frozen2: 't', 
                    words: [{c: 'c', emoji: '🐱'}, {c: 'b', emoji: '🦇'}, {c: 'h', emoji: '🎩'}, {c: 'r', emoji: '🐀'}] 
                },
                { 
                    frozen1: 'e', frozen2: 'n', 
                    words: [{c: 'p', emoji: '🖊️'}, {c: 'h', emoji: '🐔'}, {c: 't', emoji: '🔟'}] 
                },
                { 
                    frozen1: 'u', frozen2: 'g', 
                    words: [{c: 'b', emoji: '🐛'}, {c: 'm', emoji: '☕'}, {c: 'r', emoji: '🟪'}] 
                },
                { 
                    frozen1: 'o', frozen2: 'g', 
                    words: [{c: 'd', emoji: '🐶'}, {c: 'f', emoji: '🐸'}, {c: 'l', emoji: '🪵'}] 
                }
            ],
            5: [ 
                'I see a pink unicorn',
                'The princess is happy',
                'A rainbow is in the sky',
                'Look at the soft cloud',
                'The magic castle is big'
            ],
            6: [ 
                { picture: '👸🦄🏰', text: 'The princess loves her unicorn. They play by the castle. It is fun.' },
                { picture: '☁️🦄✨', text: 'Look at the pink cloud. The unicorn jumps up high. She is fast.' },
                { picture: '🧚‍♀️🪄🌈', text: 'A fairy has a wand. She makes a bright rainbow. The sky is pretty.' },
                { picture: '👸👑🦄', text: 'The princess finds a crown. She puts it on the unicorn. Good girl!' },
                { picture: '🌙💤🦄', text: 'It is time to sleep. The moon is up. Goodnight little unicorn.' }
            ],
            7: [ // Word Maker Safe Words
                { word: 'cat', emoji: '🐱' }, { word: 'dog', emoji: '🐶' }, { word: 'pig', emoji: '🐷' },
                { word: 'sun', emoji: '☀️' }, { word: 'fox', emoji: '🦊' }, { word: 'bug', emoji: '🐛' },
                { word: 'cow', emoji: '🐮' }, { word: 'owl', emoji: '🦉' }
            ]
        };

        class ShuffleBag {
            constructor(items) {
                this.original = [...items];
                this.bag = [];
                this.refill();
            }
            refill() {
                this.bag = [...this.original].sort(() => Math.random() - 0.5);
            }
            next() {
                if (this.bag.length === 0) this.refill();
                return this.bag.pop();
            }
        }

        const bags = {};
        for(let i=1; i<=TOTAL_STAGES; i++) {
            bags[i] = new ShuffleBag(curriculum[i]);
        }

        let currentStage = 1;
        let sequenceIndex = 0;
        let isInputLocked = false;
        
        function updateMenuUI() {
            const colors = ['#ff80ab', '#00b8d4', '#b388ff', '#00bcd4', '#ffd740', '#ff5252', '#ff9800'];
            for (let i = 1; i <= TOTAL_STAGES; i++) {
                const btn = document.getElementById(`btn-stage-${i}`);
                if(btn) btn.style.borderColor = colors[i - 1] || '#ccc';
            }
        }

        function showScreen(screenId) {
            synth.cancel();
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            if (screenId === 'screen-menu') updateMenuUI();
        }

        function initApp() {
            synth.cancel();
            let unlock = new SpeechSynthesisUtterance('');
            unlock.volume = 0;
            synth.speak(unlock);
            isAudioUnlocked = true;
            updateMenuUI();
            showScreen('screen-menu');
        }

        function speak(text, rate = 0.85, pitch = 1.3, callback = null) {
            if (!isAudioUnlocked) {
                if(callback) callback();
                return;
            }
            synth.cancel(); 
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = rate; 
            utterance.pitch = pitch; 
            
            const voices = synth.getVoices();
            const voice = voices.find(v => v.lang.includes('en-US') && v.name.includes('Google')) 
                       || voices.find(v => v.lang.includes('en-'));
            if (voice) utterance.voice = voice;
            
            if (callback) {
                utterance.onend = callback;
                utterance.onerror = callback;
            }
            synth.speak(utterance);
        }

        function speakSequence(wordsArray, onComplete) {
            if (!isAudioUnlocked || wordsArray.length === 0) {
                if(onComplete) onComplete();
                return;
            }
            synth.cancel();
            
            let index = 0;
            function speakNext() {
                if (index >= wordsArray.length) {
                    if (onComplete) onComplete();
                    return;
                }
                let item = wordsArray[index];
                const utterance = new SpeechSynthesisUtterance(item.text);
                utterance.rate = item.rate || 0.85;
                utterance.pitch = item.pitch || 1.3;
                
                utterance.onend = () => {
                    index++;
                    setTimeout(speakNext, item.delayAfter || 150);
                };
                utterance.onerror = () => {
                    index++;
                    speakNext();
                };
                synth.speak(utterance);
            }
            speakNext();
        }

        function fireConfetti() {
            confetti({
                particleCount: 150,
                spread: 120,
                origin: { y: 0.6 },
                colors: ['#ff80ab', '#18ffff', '#b388ff', '#ffd740', '#ffffff', '#00bcd4']
            });
        }

        function handleWinSequence(customDelay = 1800) {
            globalTasksCompleted++;
            fireConfetti();
            
            if (globalTasksCompleted % 3 === 0) {
                setTimeout(showUnicornDance, 1200);
            } else {
                setTimeout(nextRound, customDelay);
            }
        }

        function showUnicornDance() {
            const overlay = document.getElementById('praise-overlay');
            const textEl = document.getElementById('praise-text');
            const phrase = praisePhrases[Math.floor(Math.random() * praisePhrases.length)];
            
            textEl.innerText = phrase;
            overlay.classList.add('show');
            
            speak(phrase, 1.0, 1.4, () => {
                setTimeout(() => {
                    overlay.classList.remove('show');
                    nextRound();
                }, 1500); 
            });
        }

        function loadStage(stageNum) {
            currentStage = stageNum;
            showScreen('screen-game');
            nextRound();
        }

        function nextRound() {
            const board = document.getElementById('game-board');
            const inst = document.getElementById('game-instruction');
            board.innerHTML = '';
            sequenceIndex = 0;
            isInputLocked = false;
            
            // Clear global pointer events
            window.onpointermove = null;
            window.onpointerup = null;

            if (currentStage === 1) setupStage1(board, inst);
            if (currentStage === 2) setupStage2(board, inst);
            if (currentStage === 3) setupStage3(board, inst);
            if (currentStage === 4) setupStage4(board, inst);
            if (currentStage === 5) setupSequentialLevel(board, inst, 5, 'letter-block cloud-block');
            if (currentStage === 6) setupStage6(board, inst); 
            if (currentStage === 7) setupStage7(board, inst);
        }

        function setupStage1(board, inst) {
            const targetLetter = bags[1].next();
            const targetPhonetic = phoneticDict[targetLetter] || targetLetter;
            
            let pool = [...curriculum[1]].filter(l => l !== targetLetter);
            pool.sort(() => Math.random() - 0.5);
            let choices = [targetLetter, pool[0], pool[1]].sort(() => Math.random() - 0.5);

            inst.innerText = `Find the sound...`;
            
            choices.forEach((letter) => {
                let block = document.createElement('div');
                block.className = 'letter-block';
                block.innerText = letter;
                
                block.onclick = () => {
                    if (isInputLocked) return;
                    if (letter === targetLetter) {
                        isInputLocked = true;
                        block.classList.add('correct');
                        speak("Yay!", 1.0, 1.5);
                        handleWinSequence();
                    } else {
                        block.classList.remove('incorrect');
                        void block.offsetWidth; 
                        block.classList.add('incorrect');
                        speak("Try again.");
                    }
                };
                board.appendChild(block);
            });

            setTimeout(() => { speak(`Find the ${targetPhonetic} sound.`); }, 300);
        }

        function setupStage2(board, inst) {
            const word = bags[2].next();
            const letter1 = word[0];
            const letter2 = word[1];
            
            inst.innerText = "Stretch the snake!";
            speak("Drag the star to stretch the sounds.", 0.9);

            const wrapper = document.createElement('div');
            wrapper.className = 'slider-wrapper';
            
            wrapper.innerHTML = `
                <div class="slider-letters">
                    <span>${letter1}</span><span>${letter2}</span>
                </div>
                <div class="slider-track" id="l2-track">
                    <div class="slider-progress" id="l2-prog"></div>
                    <div class="slider-thumb" id="l2-thumb">⭐</div>
                </div>
            `;
            board.appendChild(wrapper);

            const track = document.getElementById('l2-track');
            const thumb = document.getElementById('l2-thumb');
            const prog = document.getElementById('l2-prog');

            let dragActive = false;
            let trackWidth = 0;
            let thumbWidth = 80;
            
            let p1Played = false;
            let p2Played = false;
            let fullWordPlayed = false;

            thumb.addEventListener('pointerdown', (e) => {
                if (isInputLocked) return;
                dragActive = true;
                trackWidth = track.offsetWidth - thumbWidth;
                thumb.style.transition = 'none';
                prog.style.transition = 'none';
                e.preventDefault();
            });

            window.onpointermove = (e) => {
                if (!dragActive || isInputLocked) return;
                e.preventDefault();
                
                let currentX = e.clientX || (e.touches && e.touches[0].clientX);
                if(!currentX) return;

                let trackLeft = track.getBoundingClientRect().left;
                let diff = currentX - trackLeft - (thumbWidth / 2);
                let progress = Math.max(0, Math.min(diff, trackWidth));
                let percent = progress / trackWidth;
                
                thumb.style.transform = `translateX(${progress}px)`;
                prog.style.width = `${percent * 100}%`;

                if (percent > 0.15 && !p1Played) {
                    p1Played = true;
                    speak(phoneticDict[letter1] || letter1, 0.6);
                }
                
                if (percent > 0.60 && !p2Played) {
                    p2Played = true;
                    speak(phoneticDict[letter2] || letter2, 0.6);
                }
                
                if (percent >= 0.98 && !fullWordPlayed) {
                    fullWordPlayed = true;
                    dragActive = false;
                    isInputLocked = true;
                    
                    thumb.style.transform = `translateX(${trackWidth}px)`;
                    prog.style.width = `100%`;
                    
                    setTimeout(() => {
                        speak(word, 1.0, 1.4);
                        thumb.innerText = "🦄";
                        handleWinSequence();
                    }, 300);
                }
            };

            window.onpointerup = () => {
                if (!dragActive || isInputLocked) return;
                dragActive = false;
                
                thumb.style.transition = 'transform 0.3s ease';
                prog.style.transition = 'width 0.3s ease';
                thumb.style.transform = `translateX(0px)`;
                prog.style.width = `0%`;
                
                p1Played = false;
                p2Played = false;
                synth.cancel();
            };
        }

        function setupStage3(board, inst) {
            const data = bags[3].next();
            const word = data.word;
            const emoji = data.emoji;
            const letters = word.split('');
            
            inst.innerText = `Pop bubbles to spell: ${word}`;
            speak("Pop the bubbles in order.");

            letters.forEach((letter, index) => {
                let block = document.createElement('div');
                block.className = 'letter-block bubble-block';
                block.innerText = letter;
                
                block.onclick = () => {
                    if (isInputLocked) return;

                    if (index === sequenceIndex) {
                        block.classList.add('correct');
                        speak(phoneticDict[letter] || letter, 0.85);
                        sequenceIndex++;

                        if (sequenceIndex === letters.length) {
                            isInputLocked = true;
                            setTimeout(() => {
                                board.innerHTML = `<div class="giant-emoji">${emoji}</div>`;
                                speak(word, 1.0, 1.3);
                                handleWinSequence();
                            }, 1000);
                        }
                    } else if (index > sequenceIndex) {
                        const correctBlock = board.children[sequenceIndex];
                        correctBlock.classList.remove('hint-shake');
                        void correctBlock.offsetWidth;
                        correctBlock.classList.add('hint-shake');
                    }
                };
                board.appendChild(block);
            });
        }

        function setupStage4(board, inst) {
            const familyData = bags[4].next();
            const f1 = familyData.frozen1;
            const f2 = familyData.frozen2;
            const wordsList = [...familyData.words].sort(() => Math.random() - 0.5);
            let usedCount = 0;

            inst.innerText = "Flip the calendar!";
            speak("Tap a letter to make a word.", 0.9);

            const container = document.createElement('div');
            container.className = 'frozen-container';
            
            const emojiEl = document.createElement('div');
            emojiEl.className = 'frozen-emoji-pop';
            emojiEl.id = 'stage4-emoji';
            
            const row = document.createElement('div');
            row.className = 'frozen-row';
            
            // Block 1 (Prefix/Calendar flip)
            const dropSlot = document.createElement('div');
            dropSlot.className = 'frozen-slot';
            dropSlot.innerText = '?';
            
            // Block 2 (Frozen)
            const block2 = document.createElement('div');
            block2.className = 'frozen-block';
            block2.innerText = f1;
            
            // Block 3 (Frozen)
            const block3 = document.createElement('div');
            block3.className = 'frozen-block';
            block3.innerText = f2;
            
            row.appendChild(dropSlot);
            row.appendChild(block2);
            row.appendChild(block3);
            row.appendChild(emojiEl);
            
            const optsRow = document.createElement('div');
            optsRow.className = 'frozen-opts';
            
            wordsList.forEach(wordObj => {
                let btn = document.createElement('div');
                btn.className = 'letter-block';
                btn.style.width = 'clamp(60px, 15vw, 90px)';
                btn.style.height = 'clamp(60px, 15vw, 90px)';
                btn.innerText = wordObj.c;
                
                btn.onclick = () => {
                    if (isInputLocked || btn.style.opacity === '0.5') return;
                    isInputLocked = true;
                    
                    // Reset animations
                    dropSlot.classList.remove('animate-flip');
                    emojiEl.classList.remove('animate-emoji-pop');
                    void dropSlot.offsetWidth; // reflow
                    
                    btn.style.opacity = '0.5';
                    btn.style.pointerEvents = 'none';
                    dropSlot.innerText = wordObj.c;
                    dropSlot.classList.add('animate-flip'); 
                    
                    let fullWord = wordObj.c + f1 + f2;
                    
                    let seq = [
                        { text: phoneticDict[wordObj.c] || wordObj.c, rate: 0.7, pitch: 1.2, delayAfter: 300 },
                        { text: phoneticDict[f1] || f1, rate: 0.7, pitch: 1.2, delayAfter: 300 },
                        { text: phoneticDict[f2] || f2, rate: 0.7, pitch: 1.2, delayAfter: 300 },
                        { text: fullWord, rate: 1.0, pitch: 1.4, delayAfter: 100 }
                    ];

                    speakSequence(seq, () => {
                        emojiEl.innerText = wordObj.emoji;
                        emojiEl.classList.add('animate-emoji-pop');
                        
                        setTimeout(() => {
                            usedCount++;
                            if (usedCount >= wordsList.length) {
                                block2.style.animation = 'bounce 1s ease';
                                block3.style.animation = 'bounce 1s ease';
                                dropSlot.style.animation = 'bounce 1s ease';
                                handleWinSequence(2500); 
                            } else {
                                dropSlot.classList.remove('animate-flip');
                                dropSlot.innerText = '?';
                                dropSlot.style.borderColor = '#90caf9';
                                dropSlot.style.background = 'rgba(255,255,255,0.5)';
                                emojiEl.classList.remove('animate-emoji-pop');
                                isInputLocked = false;
                            }
                        }, 1200);
                    });
                };
                optsRow.appendChild(btn);
            });

            container.appendChild(row);
            container.appendChild(optsRow);
            board.appendChild(container);
        }

        function setupSequentialLevel(board, inst, stageNum, customClass) {
            const data = bags[stageNum].next();
            const words = data.split(' ');
            
            inst.innerText = "Read the story steps!";
            speak("Tap the clouds to read.", 0.9);

            words.forEach((word, index) => {
                let block = document.createElement('div');
                block.className = customClass;
                block.innerText = word;
                
                block.onclick = () => {
                    if (isInputLocked) return;

                    if (index === sequenceIndex) {
                        block.classList.add('correct');
                        let cleanWord = word.replace(/[^\w\s]|_/g, "");
                        speak(cleanWord, 0.85);
                        sequenceIndex++;

                        if (sequenceIndex === words.length) {
                            isInputLocked = true;
                            setTimeout(() => {
                                let blocks = board.children;
                                for (let i=0; i<blocks.length; i++) {
                                    blocks[i].classList.remove('correct');
                                    blocks[i].classList.add('completed-blend');
                                }
                                speak(data, 1.0, 1.2);
                                handleWinSequence();
                            }, 800);
                        }
                    } else if (index > sequenceIndex) {
                        const correctBlock = board.children[sequenceIndex];
                        correctBlock.classList.remove('hint-shake');
                        void correctBlock.offsetWidth;
                        correctBlock.classList.add('hint-shake');
                    }
                };
                board.appendChild(block);
            });
        }

        function setupStage6(board, inst) {
            const data = bags[6].next();
            inst.innerText = "Tap the words to read!";
            speak("Tap the words to read the magic story.", 0.9);

            const container = document.createElement('div');
            container.className = 'story-container';
            
            const pic = document.createElement('div');
            pic.className = 'story-picture';
            pic.innerText = data.picture;
            
            const textContainer = document.createElement('div');
            textContainer.className = 'story-text';

            const words = data.text.split(' ');
            
            words.forEach((word, index) => {
                let span = document.createElement('span');
                span.className = 'story-word';
                span.innerText = word;
                
                span.onclick = () => {
                    if (isInputLocked) return;
                    if (index === sequenceIndex) {
                        span.classList.remove('story-word');
                        span.classList.add('story-word', 'active-word');
                        
                        let cleanWord = word.replace(/[^\w\s]|_/g, "").toLowerCase();
                        speak(cleanWord, 0.9);
                        sequenceIndex++;

                        if (sequenceIndex < words.length) {
                            textContainer.children[sequenceIndex].style.transform = 'scale(1.05)';
                        }

                        if (sequenceIndex === words.length) {
                            isInputLocked = true;
                            setTimeout(() => {
                                Array.from(textContainer.children).forEach(child => {
                                    child.classList.remove('active-word');
                                    child.classList.add('completed-word');
                                    child.style.transform = 'none';
                                });
                                speak(data.text, 1.0, 1.2);
                                handleWinSequence();
                            }, 800);
                        }
                    } else if (index > sequenceIndex) {
                        const correctSpan = textContainer.children[sequenceIndex];
                        correctSpan.classList.remove('hint-shake');
                        void correctSpan.offsetWidth;
                        correctSpan.classList.add('hint-shake');
                    }
                };
                textContainer.appendChild(span);
            });
            
            textContainer.children[0].style.transform = 'scale(1.05)';
            container.appendChild(pic);
            container.appendChild(textContainer);
            board.appendChild(container);
        }

        function setupStage7(board, inst) {
            const data = bags[7].next();
            const word = data.word; // e.g. "cat"
            const emoji = data.emoji;
            const letters = word.split(''); // ['c', 'a', 't']
            
            // Jumble letters for bottom area
            const jumbled = [...letters].sort(() => Math.random() - 0.5);
            let filledCount = 0;

            inst.innerText = `Make the word: ${word}`;
            speak(`Drag the letters to spell ${word}.`);

            const container = document.createElement('div');
            container.className = 'drag-container';

            // Top Drop Zones
            const dropZonesDiv = document.createElement('div');
            dropZonesDiv.className = 'drop-zones';
            const dropTargets = [];
            
            letters.forEach((targetLetter, i) => {
                const zone = document.createElement('div');
                zone.className = 'drop-zone';
                zone.dataset.expected = targetLetter;
                zone.dataset.index = i;
                dropZonesDiv.appendChild(zone);
                dropTargets.push(zone);
            });

            // Center Emoji Pop (hidden initially)
            const centerEmoji = document.createElement('div');
            centerEmoji.className = 'drag-emoji-pop';
            centerEmoji.innerText = emoji;

            // Bottom Draggable Items Container
            const itemsArea = document.createElement('div');
            itemsArea.className = 'drag-items-area';
            
            container.appendChild(dropZonesDiv);
            container.appendChild(centerEmoji);
            container.appendChild(itemsArea);
            board.appendChild(container);

            // Layout draggables after appending to DOM so we can get rects
            const startPositions = [];
            
            // Need a slight delay to let DOM render for layout measurements
            setTimeout(() => {
                const areaRect = itemsArea.getBoundingClientRect();
                const tileWidth = Math.min(110, window.innerWidth * 0.18);
                const gap = 15;
                const totalWidth = (tileWidth * 3) + (gap * 2);
                const startXOffset = (areaRect.width - totalWidth) / 2;

                jumbled.forEach((letter, index) => {
                    const tile = document.createElement('div');
                    tile.className = 'draggable-tile';
                    tile.innerText = letter;
                    
                    // Initial Layout positions (Relative to itemsArea)
                    const leftPos = startXOffset + (index * (tileWidth + gap));
                    tile.style.left = `${leftPos}px`;
                    tile.style.bottom = `0px`;
                    
                    startPositions[index] = { left: leftPos, bottom: 0 };
                    itemsArea.appendChild(tile);

                    // Touch / Pointer Events for Dragging
                    let activeDrag = false;
                    let initialX = 0;
                    let initialY = 0;
                    let currentX = 0;
                    let currentY = 0;
                    
                    // We move the element relatively using transforms during drag to keep it smooth
                    let xOffset = 0;
                    let yOffset = 0;

                    const dragStart = (e) => {
                        if (isInputLocked || tile.dataset.locked === 'true') return;
                        
                        initialX = e.clientX || (e.touches && e.touches[0].clientX);
                        initialY = e.clientY || (e.touches && e.touches[0].clientY);

                        if (e.type === 'touchstart') {
                            initialX = e.touches[0].clientX;
                            initialY = e.touches[0].clientY;
                        } else {
                            initialX = e.clientX;
                            initialY = e.clientY;
                        }

                        activeDrag = true;
                        tile.classList.add('dragging');
                        tile.style.transition = 'none';
                    };

                    const dragAction = (e) => {
                        if (!activeDrag || isInputLocked) return;
                        e.preventDefault(); // crucial for mobile to stop scrolling

                        if (e.type === 'touchmove') {
                            currentX = e.touches[0].clientX - initialX;
                            currentY = e.touches[0].clientY - initialY;
                        } else {
                            currentX = e.clientX - initialX;
                            currentY = e.clientY - initialY;
                        }

                        xOffset = currentX;
                        yOffset = currentY;

                        tile.style.transform = `translate(${xOffset}px, ${yOffset}px) scale(1.1)`;
                    };

                    const dragEnd = (e) => {
                        if (!activeDrag) return;
                        initialX = currentX;
                        initialY = currentY;
                        activeDrag = false;
                        tile.classList.remove('dragging');
                        
                        // Collision Detection
                        const tileRect = tile.getBoundingClientRect();
                        let droppedOnTarget = null;
                        
                        // Check overlap with drop zones
                        for (let zone of dropTargets) {
                            if (zone.dataset.filled === 'true') continue;
                            const zoneRect = zone.getBoundingClientRect();
                            
                            // Simple bounding box intersection
                            const overlap = !(tileRect.right < zoneRect.left || 
                                              tileRect.left > zoneRect.right || 
                                              tileRect.bottom < zoneRect.top || 
                                              tileRect.top > zoneRect.bottom);
                            if (overlap) {
                                droppedOnTarget = zone;
                                break;
                            }
                        }

                        if (droppedOnTarget && droppedOnTarget.dataset.expected === letter) {
                            // Lock it in
                            speak(phoneticDict[letter] || letter, 0.85);
                            tile.dataset.locked = 'true';
                            droppedOnTarget.dataset.filled = 'true';
                            droppedOnTarget.classList.add('filled');
                            droppedOnTarget.innerText = letter;
                            
                            // Hide original tile visually
                            tile.style.display = 'none';
                            
                            filledCount++;
                            
                            // Check win condition
                            if (filledCount === 3) {
                                isInputLocked = true;
                                setTimeout(() => {
                                    speak(word, 1.0, 1.3);
                                    centerEmoji.classList.add('show');
                                    handleWinSequence(2500);
                                }, 500);
                            }
                        } else {
                            // Snap back
                            if (droppedOnTarget) {
                                // Shook for incorrect
                                droppedOnTarget.classList.remove('hint-shake');
                                void droppedOnTarget.offsetWidth;
                                droppedOnTarget.classList.add('hint-shake');
                            }
                            
                            tile.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                            tile.style.transform = `translate(0px, 0px) scale(1)`;
                            xOffset = 0;
                            yOffset = 0;
                        }
                    };

                    // Bind events for both pointer and touch fallback
                    tile.addEventListener('pointerdown', dragStart);
                    window.addEventListener('pointermove', dragAction, {passive: false});
                    window.addEventListener('pointerup', dragEnd);
                    
                    // Fallback Touch specifically for tricky iOS Safari behaviors
                    tile.addEventListener('touchstart', dragStart, {passive: false});
                    window.addEventListener('touchmove', dragAction, {passive: false});
                    window.addEventListener('touchend', dragEnd);
                });
            }, 50); // small delay to ensure rendering
        }

    </script>
